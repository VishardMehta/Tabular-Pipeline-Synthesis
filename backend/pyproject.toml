[project]
name = "agentic-automl-backend"
version = "0.1.0"
description = "Agentic AutoML MVP-1 backend. Profiles a tabular dataset and generates a pipeline."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "python-multipart>=0.0.12",
    # Capped below 3.0 deliberately. pandas 3.0 defaults string columns to a
    # real str dtype rather than object, which breaks every rung of the stage-2
    # dtype ladder that tests for object, and the LLM generates 2.x idiom from
    # its training data, so the profiler and the generated code would disagree
    # about the same file. Same reasoning as dropping pyarrow. The runner venv
    # in stage 6 must carry the identical pin.
    "pandas>=2.2,<3",
    "numpy>=2.1",
    "google-genai>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "ruff>=0.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
# Constants-only module. Long explanatory comments are the point of the file.
"app/heuristics.py" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-q"
